name: Tech News Telegram Digest

on:
  schedule:
    - cron: '0 8,18 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    environment: TELEGRAM_BOT_TOKEN
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Send tech digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_FEEDS: ${{ secrets.NEWS_FEEDS }}
          FETCH_LIMIT: ${{ vars.FETCH_LIMIT || '20' }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS || '5' }}
          LOG_LEVEL: info
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are unavailable. Check the selected GitHub environment and secret names."
            exit 1
          fi
          npm run dev
